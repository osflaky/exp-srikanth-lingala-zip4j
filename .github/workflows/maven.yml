name: Verify Build

on:
  workflow_dispatch:

jobs:
  test-on-windows:
    name: Run zip4j tests on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B -Pskip-slow-tests clean verify --file pom.xml
    timeout-minutes: 150
